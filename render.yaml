services:
  - type: web
    name: pc-almofadas-exclusivas
    runtime: python
    plan: starter
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: loja-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: BLACKCAT_API_KEY
        sync: false
      - key: ADMIN_SYNC_PASSWORD
        sync: false
